# from the project directory, run
#
# mkdir -p /tmp/nginx && nginx -c "$PWD/nginx/nginx.conf" -p /tmp/nginx
#
# and to quit, run
#
# nginx -c "$PWD/nginx/nginx.conf" -s quit
#
# Also, change the proxy url to :6000 if you are using it manually

worker_processes 8;
worker_rlimit_nofile 65535;
pid /tmp/nginx/nginx.pid;
error_log /tmp/nginx/error.log crit;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    access_log off;
    error_log /dev/null crit;

    tcp_nodelay on;
    #keepalive_timeout 0;
    # we honour client keep-alive, so nginx must too for the comparison
    keepalive_timeout 65;
    keepalive_requests 100000;
    reset_timedout_connection on;

    upstream backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 127.0.0.1:6000 reuseport;
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # nexus does no buffering in either direction
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
