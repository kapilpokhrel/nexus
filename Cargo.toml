[package]
name = "conduit"
version = "0.1.0"
edition = "2024"

[dependencies]
httparse = "1.10.1"
libc = "0.2.189"
mlua = { version = "0.11.6", features = ["lua54", "macros", "async"] }
monoio = { version = "0.2.4" }
serde = { version = "1.0.229", features = ["serde_derive"] }
tealr = { version = "0.11.0", features = ["mlua"] }
toml = "1.1.3"
